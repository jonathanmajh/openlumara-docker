services:
  openlumara:
    # Use the image built by GitHub Actions
    image: ghcr.io/jonathanmajh/openlumara:latest
    # ...or, if you'd rather build locally from the Dockerfile instead of
    # pulling a prebuilt image, comment out `image:` above and uncomment this:
    # build:
    #   context: .
    #   args:
    #     OPENLUMARA_REF: main

    container_name: openlumara
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./openlumara-data:/app/data
      - ./config.yml:/app/config.yml
    # uncomment if you want OpenLumara to use the sandboxed-shell
    # unsafe-shell is already enabled 
    # technically unsafe-shell is safer since docker socket gives access to host machine
      # - /var/run/docker.sock:/var/run/docker.sock

    # Uncomment if you're pointing OpenLumara at an OpenAI-compatible API
    # (llamacpp, ollama, koboldcpp, etc) running on your host machine.
    # Then use http://host.docker.internal:<port> as the API URL in the
    # WebUI's settings panel.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"   # needed on Linux; no-op on macOS/Windows